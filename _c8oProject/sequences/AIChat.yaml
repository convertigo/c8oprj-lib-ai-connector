comment: |
  'Hat (facade) sequence: routes a chat completion request to the right provider connector.
  
  Variables: provider (openai | anthropic | gemini | mistral, default openai), prompt (required), model, system, temperature, max_tokens, api_key (empty = the provider''s lib_AIConnector symbol), base_url (openai provider only), file (optional multipart upload: image or PDF), file_type (optional MIME type, guessed from the extension when empty).
  
  Dispatch: openai -> ChatCompletion, anthropic -> AnthropicMessage, gemini -> GeminiMessage, mistral -> MistralMessage. With a file, the user content becomes multimodal (image or PDF blocks + text); Mistral supports images only (use a vision model such as pixtral-12b-2409 or mistral-medium-latest). The answer shape follows the target provider.'
