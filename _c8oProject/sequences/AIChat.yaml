accessibility: Private
comment: |
  'Hat (facade) sequence: routes a chat completion request to the right provider connector.
  
  Variables: provider (openai|anthropic|gemini|mistral, default openai), prompt (required), model, system, temperature, max_tokens, api_key, base_url (openai only), file (optional image or PDF, multipart upload), file_type.
  
  Files API architecture: every upload goes through the Convertigo HTTP connector transactions (multipartFormData streaming, no Java networking in Rhino scripts):
  - openai: AI.UploadFile (purpose=user_data) → file_id in the chat message
  - anthropic: Anthropic.UploadFile (files API beta) → file_id in the chat message
  - gemini: Gemini.UploadStart + Gemini.UploadFile (resumable upload, x-goog headers) → file URI in the chat message
  - mistral: Mistral.UploadFile (purpose=ocr) → Mistral.FileUrl (signed URL) → Mistral.Ocr (markdown) → text in the chat message; images stay inline base64 (vision models such as pixtral-12b)'
