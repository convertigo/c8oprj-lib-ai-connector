    variableName: updated
  ↓CheckCancelled [steps.SimpleStep-1793090453274]: 
    comment: Fails when the status could not be changed.
    expression: |
      'updated = updated && updated.couchdb_output !== undefined ? updated.couchdb_output : updated;
      if (!updated || (updated.ok !== true && String(updated.ok) !== ''true'')) { throw ''cancelling the job failed: '' + JSON.stringify(updated); }'
