  variableName: doc
↓Shape [steps.SimpleStep-1793090453230]: 
  comment: Checks the caller owns the job, then keeps the fields a client needs (never the secrets nor the prompt files).
  expression: |
    'doc = doc && doc.couchdb_output !== undefined ? doc.couchdb_output : doc;  // JsonSource gives {couchdb_output: doc}
    var me = String(context.getAuthenticatedUser() || '''');
    if (me == '''' || !doc || doc.error || String(doc[''~c8oAcl''] || '''') != me) { throw ''job not found: '' + _use_docid; }
    var r = doc.result || {};
    var e = r[''export''] || {};
    var runner = doc.runner || {};
    var att = doc._attachments || {};
    var outputs = [];
    for (var k in att) {
      if (k.indexOf(''output/'') == 0) { outputs.push({name: k.substring(7), size: att[k].length, contentType: att[k].content_type}); }
    }
    job = {
      jobId: doc._id, status: doc.status, createdAt: doc.createdAt || null, scheduledAt: doc.scheduledAt || null,
      startedAt: runner.startedAt || null, finishedAt: runner.finishedAt || null,
      model: (r.model || {}).alias || (doc.vibe || {}).model || null,
      progress: doc.progress || null, finalMessage: r.finalMessage || null, error: r.error || e.error || null,
      costUsd: r.totalCostUsd != null ? r.totalCostUsd : (e.cost_usd != null ? e.cost_usd : null),
      outputs: outputs
    };'
