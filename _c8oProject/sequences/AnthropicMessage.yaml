↓prepare [steps.SimpleStep-1791565379244]: 
  comment: Builds the Anthropic /v1/messages request from the sequence scope. Files (PDF and images) are uploaded by the Call_UploadFile transaction step (Anthropic Files API, multipart by the HTTP connector) and referenced by file_id; no base64 anymore.
  expression: |
    '// Builds the Anthropic /v1/messages request.
    // Files (PDF and images): uploaded through the Anthropic connector UploadFile transaction (file_id in uploadFileId), referenced by file_id. No base64.
    (__header_anthropic_version = ''2023-06-01'') == '''';
    var uc;
    var fp = String(file || '''').trim();
    if (fp == '''') {
      uc = String(prompt);
    } else {
      var mime = String(file_type || '''').trim();
      if (mime == '''') {
        var ext = fp.toLowerCase().replace(/.*\./, '''');
        mime = (ext == ''jpg'' || ext == ''jpeg'') ? ''image/jpeg'' : ext == ''gif'' ? ''image/gif'' : ext == ''webp'' ? ''image/webp'' : ext == ''pdf'' ? ''application/pdf'' : ''image/png'';
      }
      if (mime == ''application/pdf'') {
        uc = [{ type: ''document'', source: { type: ''file'', file_id: String(uploadFileId) } }, { type: ''text'', text: String(prompt) }];
      } else {
        uc = [{ type: ''image'', source: { type: ''file'', file_id: String(uploadFileId) } }, { type: ''text'', text: String(prompt) }];
      }
    }
    var body = { model: String(model), max_tokens: 1024, messages: [{ role: ''user'', content: uc }] };
    if (String(system || '''') != '''') { body.system = String(system); }
    var t = Number(temperature);
    if (!isNaN(t)) { body.temperature = t; }
    var mt = Number(max_tokens);
    if (String(max_tokens || '''') != '''' && !isNaN(mt)) { body.max_tokens = mt; }
    __body = JSON.stringify(body);'
