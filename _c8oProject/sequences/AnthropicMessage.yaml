  comment: Resolves the uploaded file path (relative paths in test cases are resolved against the Convertigo projects directory) as a hidden element used as the Call_UploadFile file source.
  expression: |
    'var fp = String(file || '''').trim();
    if (fp != '''') {
      var f = new java.io.File(fp);
      if (!f.exists()) {
        var pd = String(com.twinsoft.convertigo.engine.Engine.PROJECTS_PATH);
        var c1 = new java.io.File(pd + ''/lib_AIConnector/'' + fp);
        var c2 = new java.io.File(pd + ''/'' + fp);
        fp = c1.exists() ? String(c1.getAbsolutePath()) : (c2.exists() ? String(c2.getAbsolutePath()) : fp);
      }
    }
    fp'
  nodeName: FilePath
  output: false
