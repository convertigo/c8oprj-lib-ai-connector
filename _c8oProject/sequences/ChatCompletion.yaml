comment: |
  'Chat completion for any OpenAI-compatible /v1/chat/completions endpoint (OpenAI default, or any provider through base_url: Groq, OpenRouter, Together, DeepSeek, xAI, Perplexity, Ollama...).
  
  Variables: prompt (required), model (default gpt-4o-mini), system, temperature, max_tokens, base_url (empty = OpenAI), api_key (empty = lib_AIConnector.openai_apikey.secret symbol).
  
  The Build_Body / Build_Auth / Build_Uri steps build the request (JSON body, Bearer header, full URL) as hidden XML elements; the Call_Transaction step variables read them through sourceDefinition references.
  
  Returns the provider response document (choices[0].message.content holds the answer).'
↓Build_Body [steps.ElementStep-1791797025703]: 
  comment: Builds the chat/completions JSON body (model, messages, temperature, max_tokens) as a hidden element used as source by Call_Transaction.
  expression: |
    'var m = [];
    if (String(system || '''') != '''') { m.push({ role: ''system'', content: String(system) }); }
    m.push({ role: ''user'', content: String(prompt) });
    var b = { model: String(model || ''gpt-4o-mini''), messages: m };
    var t = Number(temperature);
    if (String(temperature || '''') != '''' && !isNaN(t)) { b.temperature = t; }
    var mt = Number(max_tokens);
    if (String(max_tokens || '''') != '''' && !isNaN(mt)) {
      if (/^(gpt-5|o[0-9])/.test(String(model))) { b.max_completion_tokens = mt; } else { b.max_tokens = mt; }
    }
    JSON.stringify(b)'
  nodeName: Body
  output: false
↓Build_Auth [steps.ElementStep-1791797025718]: 
  comment: Builds the Authorization header value (Bearer + api_key or lib_AIConnector.openai_apikey.secret symbol) as a hidden element used as source by Call_Transaction.
  expression: '''Bearer '' + (String(api_key || '''').trim() != '''' ? String(api_key).trim() : String(''${lib_AIConnector.openai_apikey.secret=}'').trim())'
  nodeName: Auth
  output: false
↓Build_Uri [steps.ElementStep-1791797025728]: 
  comment: Builds the full endpoint URL (base_url override for any OpenAI-compatible provider, default OpenAI) as a hidden element used as source by Call_Transaction.
  expression: |
    var base = String(base_url || '').trim();
    if (base == '') { base = 'https://api.openai.com/v1/chat/completions'; }
    if (base.indexOf('://') == -1) { base = 'https://' + base; }
    if (!/\/chat\/completions\/?$/.test(base)) { base = base.replace(/\/+$/, '') + '/chat/completions'; }
    base
  nodeName: Uri
  output: false
