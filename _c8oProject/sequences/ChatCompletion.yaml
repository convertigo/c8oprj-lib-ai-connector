↓Build_Uri [steps.ElementStep-1791797025728]: 
  comment: Builds the full endpoint URL (base_url override for any OpenAI-compatible provider, default OpenAI) as a hidden element used as source by Call_Transaction.
  expression: |
    var base = String(base_url || '').trim();
    if (base == '') { base = 'https://api.openai.com/v1/chat/completions'; }
    if (base.indexOf('://') == -1) { base = 'https://' + base; }
    if (!/\/chat\/completions\/?$/.test(base)) { base = base.replace(/\/+$/, '') + '/chat/completions'; }
    base
  nodeName: Uri
  output: false
