↓Build_Body [steps.ElementStep-1791797025703]: 
  comment: 'Builds the chat/completions JSON body from the sequence scope: messages (with the uploaded PDF file_id when a PDF was provided), model, temperature, max_tokens. Runs after Call_UploadFile so uploadFileId is available. Image files are rejected (no base64): use AIChat, which routes images to OpenAIResponses.'
  expression: |
    'var m = [];
    if (String(system || '''') != '''') { m.push({ role: ''system'', content: String(system) }); }
    var uc;
    var fp = String(file || '''').trim();
    if (fp != '''') {
      var rf = new java.io.File(fp);
      if (!rf.exists()) {
        var pd = String(com.twinsoft.convertigo.engine.Engine.PROJECTS_PATH);
        var r1 = new java.io.File(pd + ''/lib_AIConnector/'' + fp);
        var r2 = new java.io.File(pd + ''/'' + fp);
        fp = r1.exists() ? String(r1.getAbsolutePath()) : (r2.exists() ? String(r2.getAbsolutePath()) : fp);
      }
    }
    if (fp == '''') {
      uc = String(prompt);
    } else {
      var mime = String(file_type || '''').trim();
      if (mime == '''') {
        var ext = fp.toLowerCase().replace(/.*\./, '''');
        mime = (ext == ''jpg'' || ext == ''jpeg'') ? ''image/jpeg'' : ext == ''gif'' ? ''image/gif'' : ext == ''webp'' ? ''image/webp'' : ext == ''pdf'' ? ''application/pdf'' : ''image/png'';
      }
      if (mime == ''application/pdf'') {
        uc = [{ type: ''file'', file: { file_id: String(uploadFileId) } }, { type: ''text'', text: String(prompt) }];
      } else {
        throw ''Image files are not supported in ChatCompletion without base64: use AIChat (routes images to OpenAIResponses, binary Files API pipeline).'';
      }
    }
    m.push({ role: ''user'', content: uc });
    var b = { model: String(model || ''gpt-4o-mini''), messages: m };
    var t = Number(temperature);
    if (String(temperature || '''') != '''' && !isNaN(t)) { b.temperature = t; }
    var mt = Number(max_tokens);
    if (String(max_tokens || '''') != '''' && !isNaN(mt)) {
      if (/^(gpt-5|o[0-9])/.test(String(model))) { b.max_completion_tokens = mt; } else { b.max_tokens = mt; }
    }
    JSON.stringify(b)'
  nodeName: Body
  output: false
