accessibility: Private
comment: |
  'Encrypts a secret (for example the client''s own LLM API key) for an AgentRunner job doc.
  
  The result goes into the job doc''s "secrets" field, for example "secrets": {"LITELLM_API_KEY": <envelope>}. Only the AgentRunner daemon can decrypt it; it hands the plain value to that job''s agent only.
  
  Variable: value (required, masked everywhere).
  
  Key: the AgentRunner AES-256 key (32 bytes, base64), the AGENTRUNNER_SECRET_KEY of the agentrunner-key Kubernetes Secret, from the lib_AIConnector.agentrunner_key.secret symbol (administration console), else from the AGENTRUNNER_SECRET_KEY environment variable of the Convertigo server. The key never leaves the server.
  
  Format: AES-256-GCM, random 12-byte IV, ct = ciphertext followed by the 16-byte tag, both base64.
  
  Output: {"envelope": {"$enc": "A256GCM", "iv": "...", "ct": "..."}}. Call it from the server-side sequence that creates the job doc; never expose it to clients.'
↓Encrypt [steps.SimpleStep-1791997873466]: 
  comment: Encrypts value with the AgentRunner key (AES-256-GCM, random 12-byte IV) into the encIv / encCt JavaScript variables used by the envelope fields. The key comes from the lib_AIConnector.agentrunner_key.secret symbol, else from the AGENTRUNNER_SECRET_KEY environment variable.
  expression: |
    'var keyB64 = String(''${lib_AIConnector.agentrunner_key.secret=}'').trim();
    if (keyB64 == '''') { keyB64 = String(java.lang.System.getenv(''AGENTRUNNER_SECRET_KEY'') || '''').trim(); }
    if (keyB64 == '''') { throw ''AgentRunner key missing: set the lib_AIConnector.agentrunner_key.secret symbol, or the AGENTRUNNER_SECRET_KEY environment variable of the Convertigo server.''; }
    var plain = String(value || '''');
    if (plain == '''') { throw ''value is required''; }
    var b64 = java.util.Base64;
    var key = b64.getDecoder().decode(keyB64);
    if (key.length != 32) { throw ''The AgentRunner key must be 32 bytes, base64-encoded.''; }
    var iv = java.lang.reflect.Array.newInstance(java.lang.Byte.TYPE, 12);
    new java.security.SecureRandom().nextBytes(iv);
    var cipher = javax.crypto.Cipher.getInstance(''AES/GCM/NoPadding'');
    cipher.init(javax.crypto.Cipher.ENCRYPT_MODE, new javax.crypto.spec.SecretKeySpec(key, ''AES''), new javax.crypto.spec.GCMParameterSpec(128, iv));
    var ct = cipher.doFinal(new java.lang.String(plain).getBytes(''UTF-8''));
    encIv = String(b64.getEncoder().encodeToString(iv));
    encCt = String(b64.getEncoder().encodeToString(ct));'
