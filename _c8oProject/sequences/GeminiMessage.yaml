↓prepare [steps.SimpleStep-1791565455624]: 
  comment: Builds the Gemini chat/completions request from the sequence scope. Uploaded files are streamed by the UploadStart/UploadFile transaction steps (Gemini resumable Files API, binary body sent by the HTTP connector); the UploadFile JSON response is parsed here to get the file URI. No base64 and no Java networking in the chat request.
  expression: |
    '// Builds the Gemini request through the official OpenAI-compatible endpoint.
    // Uploaded files: URI parsed from the UploadFile transaction JSON response.
    var geminiFileUri = '''';
    var gur = (typeof geminiUploadResponse == ''undefined'') ? '''' : geminiUploadResponse;
    if (String(gur || '''').trim() != '''') {
      try {
        var resp = JSON.parse(String(gur));
        geminiFileUri = String(resp.file && resp.file.uri ? resp.file.uri : '''');
      } catch (e) { geminiFileUri = ''''; }
    }
    var messages = [];
    if (String(system || '''') != '''') {
      messages.push({ role: ''system'', content: String(system) });
    }
    var uc;
    var fp = String(file || '''').trim();
    if (fp == '''') {
      uc = String(prompt);
    } else {
      uc = [{ type: ''image_url'', image_url: { url: geminiFileUri } }, { type: ''text'', text: String(prompt) }];
    }
    messages.push({ role: ''user'', content: uc });
    var modelId = String(model || '''');
    if (modelId == '''') { modelId = ''gemini-2.5-flash''; }
    var body = { model: modelId, messages: messages };
    var t = Number(temperature);
    if (String(temperature || '''') != '''' && !isNaN(t)) { body.temperature = t; }
    var mt = Number(max_tokens);
    if (String(max_tokens || '''') != '''' && !isNaN(mt)) { body.max_tokens = mt; }
    __body = JSON.stringify(body);'
