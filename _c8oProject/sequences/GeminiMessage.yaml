comment: |
  'Chat completion through the Google Gemini API (official OpenAI-compatible endpoint /v1beta/openai/chat/completions).
  
  Variables: prompt (required), model (default gemini-2.5-flash), system, temperature, max_tokens, api_key (empty = lib_AIConnector.gemini_apikey.secret symbol).
  
  Returns the provider response document (choices[0].message.content holds the answer).'
↓prepare [steps.SimpleStep-1791565455624]: 
  comment: 'Builds the Gemini OpenAI-compatible chat/completions request: messages (system + multimodal user content), Bearer Authorization header, model (default gemini-2.5-flash).'
  expression: |
    '// Builds the Gemini request through the official OpenAI-compatible endpoint
    // /v1beta/openai/chat/completions.
    // Variables: prompt (required), model, system, temperature, max_tokens, api_key, file (optional), file_type (optional).
    var key = String(api_key || '''').trim();
    var auth;
    if (key == '''') {
      auth = ''Bearer ${lib_AIConnector.gemini_apikey.secret=}'';
    } else {
      auth = ''Bearer '' + key;
    }
    (__header_Authorization = auth) == '''';
    var messages = [];
    if (String(system || '''') != '''') {
      messages.push({ role: ''system'', content: String(system) });
    }
    var uc;
    var fp = String(file || '''').trim();
    if (fp == '''') {
      uc = String(prompt);
    } else {
      var fis = new java.io.FileInputStream(fp);
      var bos = new java.io.ByteArrayOutputStream();
      var buf = java.lang.reflect.Array.newInstance(java.lang.Byte.TYPE, 8192);
      var n;
      while ((n = fis.read(buf)) != -1) { bos.write(buf, 0, n); }
      fis.close();
      var b64 = String(java.util.Base64.getEncoder().encodeToString(bos.toByteArray()));
      var mime = String(file_type || '''').trim();
      if (mime == '''') {
        var ext = fp.toLowerCase().replace(/.*\./, '''');
        mime = (ext == ''jpg'' || ext == ''jpeg'') ? ''image/jpeg'' : ext == ''gif'' ? ''image/gif'' : ext == ''webp'' ? ''image/webp'' : ext == ''pdf'' ? ''application/pdf'' : ''image/png'';
      }
      uc = [];
      if (mime == ''application/pdf'') {
        uc.push({ type: ''file'', file: { filename: ''upload.pdf'', file_data: ''data:application/pdf;base64,'' + b64 } });
      } else {
        uc.push({ type: ''image_url'', image_url: { url: ''data:'' + mime + '';base64,'' + b64 } });
      }
      uc.push({ type: ''text'', text: String(prompt) });
    }
    messages.push({ role: ''user'', content: uc });
    var modelId = String(model || '''');
    if (modelId == '''') { modelId = ''gemini-2.5-flash''; }
    var body = { model: modelId, messages: messages };
    var t = Number(temperature);
    if (String(temperature || '''') != '''' && !isNaN(t)) { body.temperature = t; }
    var mt = Number(max_tokens);
    if (String(max_tokens || '''') != '''' && !isNaN(mt)) { body.max_tokens = mt; }
    __body = JSON.stringify(body);'
