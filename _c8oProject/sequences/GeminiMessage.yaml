comment: |
  'Chat completion through the Google Gemini API (official OpenAI-compatible endpoint /v1beta/openai/chat/completions).
  
  Variables: prompt (required), model (default gemini-2.5-flash), system, temperature, max_tokens, api_key (empty = lib_AIConnector.gemini_apikey.secret symbol).
  
  Returns the provider response document (choices[0].message.content holds the answer).'
↓prepare [steps.SimpleStep-1791565455624]: 
  comment: 'Builds the Gemini OpenAI-compatible chat/completions request: messages (system + user), Bearer Authorization header, model (default gemini-2.5-flash).'
  expression: |
    '// Builds the Gemini request through the official OpenAI-compatible endpoint
    // /v1beta/openai/chat/completions (the native generateContent URL contains a colon
    // that the Convertigo HTTP client cannot send reliably).
    // Variables: prompt (required), model, system, temperature, max_tokens, api_key.
    // Scope capture: assign through a parenthesized statement with a bare variable on the right-hand side.
    var key = String(api_key || "").trim();
    var auth;
    if (key == "") {
      // Default key: lib_AIConnector.gemini_apikey.secret symbol (administration console).
      auth = ''Bearer ${lib_AIConnector.gemini_apikey.secret=}'';
    } else {
      auth = ''Bearer '' + key;
    }
    (__header_Authorization = auth) == '''';
    var messages = [];
    if (String(system || "") != "") {
      messages.push({ role: "system", content: String(system) });
    }
    messages.push({ role: "user", content: String(prompt) });
    var modelId = String(model || "");
    if (modelId == "") { modelId = "gemini-2.5-flash"; }
    var body = { model: modelId, messages: messages };
    var t = Number(temperature);
    if (String(temperature || "") != "" && !isNaN(t)) { body.temperature = t; }
    var mt = Number(max_tokens);
    if (String(max_tokens || "") != "" && !isNaN(mt)) { body.max_tokens = mt; }
    __body = JSON.stringify(body);'
