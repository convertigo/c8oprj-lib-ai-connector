↓prepare [steps.SimpleStep-1791566386616]: 
  comment: 'Builds the Mistral chat/completions request. Files: connector transactions (Files API upload + signed URL; OCR for PDFs) ran before this step. PDFs: the extracted markdown arrives through the mistralOcrText JS variable. Images: the signed URL is used as image_url (binary pipeline, no base64).'
  expression: |
    '// Builds the Mistral /v1/chat/completions request.
    // Files: the connector transactions (Files API upload + signed URL, OCR for PDFs) ran before this step.
    // PDFs: the extracted markdown arrives through the mistralOcrText JS variable.
    // Images: the signed URL is used as image_url (binary pipeline, no base64).
    var messages = [];
    if (String(system || '''') != '''') {
      messages.push({ role: ''system'', content: String(system) });
    }
    var uc;
    var fp = String(file || '''').trim();
    if (fp != '''') {
      var rf = new java.io.File(fp);
      if (!rf.exists()) {
        var pd = String(com.twinsoft.convertigo.engine.Engine.PROJECTS_PATH);
        var r1 = new java.io.File(pd + ''/lib_AIConnector/'' + fp);
        var r2 = new java.io.File(pd + ''/'' + fp);
        fp = r1.exists() ? String(r1.getAbsolutePath()) : (r2.exists() ? String(r2.getAbsolutePath()) : fp);
      }
    }
    if (fp == '''') {
      uc = String(prompt);
    } else {
      var mime = String(file_type || '''').trim();
      if (mime == '''') {
        var ext = fp.toLowerCase().replace(/.*\./, '''');
        mime = (ext == ''jpg'' || ext == ''jpeg'') ? ''image/jpeg'' : ext == ''gif'' ? ''image/gif'' : ext == ''webp'' ? ''image/webp'' : ext == ''pdf'' ? ''application/pdf'' : ''image/png'';
      }
      if (mime == ''application/pdf'') {
        var ocr = '''';
        var ot = (typeof mistralOcrText == ''undefined'') ? '''' : mistralOcrText;
        if (ot != null && String(ot).trim() != '''') {
          if (ot instanceof java.lang.Object && ot instanceof org.w3c.dom.NodeList) {
            for (var i = 0; i < ot.getLength(); i++) { ocr += String(ot.item(i).getNodeValue()) + ''\n\n''; }
          } else {
            ocr = String(ot);
          }
        }
        uc = ''Document content (extracted with OCR):\n'' + ocr + ''\n\n'' + String(prompt);
      } else {
        var su = (typeof mistralSignedUrl == ''undefined'' || mistralSignedUrl == null) ? '''' : String(mistralSignedUrl);
        if (su != '''' && su != ''null'' && su.indexOf(''https://'') == 0) {
          uc = [{ type: ''image_url'', image_url: { url: su } }, { type: ''text'', text: String(prompt) }];
        } else {
          throw ''Mistral image pipeline failed: no signed URL from the Files API upload (no base64 fallback).'';
        }
      }
    }
    messages.push({ role: ''user'', content: uc });
    var modelId = String(model || '''');
    if (modelId == '''') { modelId = ''mistral-large-latest''; }
    var body = { model: modelId, messages: messages };
    var t = Number(temperature);
    if (String(temperature || '''') != '''' && !isNaN(t)) { body.temperature = t; }
    var mt = Number(max_tokens);
    if (String(max_tokens || '''') != '''' && !isNaN(mt)) { body.max_tokens = mt; }
    __body = JSON.stringify(body);'
