↓build_report [steps.SimpleStep-1791800478230]: 
  comment: Builds the nr_report JS object (counts + checks) consumed by the json_report JSON steps.
  expression: |
    'var failed = 0;
    for (var i = 0; i < results.length; i++) { if (results[i].status != ''PASS'') failed++; }
    var nr_report = {total: results.length, passed: results.length - failed, failed: failed, status: failed == 0 ? ''PASS'' : ''FAIL''};'
