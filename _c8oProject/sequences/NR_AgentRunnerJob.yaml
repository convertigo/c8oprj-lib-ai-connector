comment: 'Non-regression suite for AgentRunnerJob / AgentRunnerJobStatus / AgentRunnerJobCancel: starts a job scheduled in 2099 (never run, no LLM cost) with an input file, reads it, cancels it, and checks that another user can neither read nor cancel it. Reports PASS/FAIL per check. Needs the lib_AIConnector.agentrunner.key.secret symbol (AgentRunner key).'
