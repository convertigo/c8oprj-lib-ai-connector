↓init [steps.SimpleStep-1793090512210]: 
  comment: Test helper and the inputs of the test job.
  expression: |
    'var results = [];
    function __nr_check(name, ok, detail) {
      results.push({name: name, status: ok ? ''PASS'' : ''FAIL'', detail: String(detail)});
    }
    // JsonSource steps give {document: content}
    function __nr_doc(o) { return o && o.document !== undefined ? o.document : o; }
    prompt = ''Reply with just the word OK.'';
    api_key = ''nr-dummy-key-not-a-real-one'';
    max_turns = ''3'';
    scheduled_at = ''2099-01-01T00:00:00Z'';
    files = [''js/nr_agentrunner_input.js''];'
