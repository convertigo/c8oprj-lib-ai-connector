↓check_start [steps.SimpleStep-1793090512228]: 
  comment: Asserts the job id, the scheduled status and the attached input.
  expression: |
    'start = __nr_doc(start);
    jobId = start && start.jobId ? String(start.jobId) : '''';
    __nr_check(''start: job id'', jobId.indexOf(''job-'') == 0, JSON.stringify(start).substring(0, 400));
    __nr_check(''start: scheduled'', start && start.status == ''scheduled'', start && start.status);
    var ins = start && start.inputs ? [].concat(start.inputs) : [];
    __nr_check(''start: input file attached'', ins.join('','').indexOf(''nr_agentrunner_input.js'') >= 0, ins.join('',''));'
