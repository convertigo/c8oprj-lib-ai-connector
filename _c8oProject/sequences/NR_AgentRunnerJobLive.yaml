↓check_end [steps.SimpleStep-1793091561379]: 
  comment: Asserts the job succeeded with the expected answer, model and a cost.
  expression: |
    'var j = job || {};
    __nr_check(''end: succeeded'', j.status == ''succeeded'', j.status + '' after '' + polls + '' polls'' + (j.error ? '': '' + j.error : ''''));
    __nr_check(''end: answer OK'', /\bOK\b/.test(String(j.finalMessage || '''')), j.finalMessage);
    __nr_check(''end: model recorded'', !!j.model, j.model);
    __nr_check(''end: cost recorded'', Number(j.costUsd) > 0, j.costUsd);
    var h = j.progress && j.progress.history ? [].concat(j.progress.history) : [];
    __nr_check(''end: progress history'', h.length > 0, h.length + '' entries'');
    history = h;
    _use_docid = jobId;  // for Cleanup'
