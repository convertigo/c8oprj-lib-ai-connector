accessibility: Private
comment: 'End-to-end test of AgentRunnerJob on a live AgentRunner cluster: starts a small real job with the default LLM key (lib_AIConnector.agentrunner.api_key.secret symbol, api_key left empty), polls AgentRunnerJobStatus every 3 s until it ends (5 min at most), then checks status, answer, model and cost. Costs a few cents of LLM usage. Reports PASS/FAIL per check and the job''s progress history.'
responseTimeout: 600
