↓Build_Body [steps.ElementStep-1791816987359]: 
  comment: 'Builds the Responses API request body from the sequence scope: input messages (input_image with the uploaded file_id for images, input_file for PDFs, plain text otherwise), model, temperature, max_output_tokens. Runs after Call_UploadFile so uploadFileId is available.'
  expression: |
    'var inp = [];
    if (String(system || '''') != '''') { inp.push({ role: ''system'', content: String(system) }); }
    var fp = String(file || '''').trim();
    var uc;
    if (fp == '''') {
      uc = String(prompt);
    } else {
      var mime = String(file_type || '''').trim();
      if (mime == '''') {
        var ext = fp.toLowerCase().replace(/.*\./, '''');
        mime = (ext == ''jpg'' || ext == ''jpeg'') ? ''image/jpeg'' : ext == ''gif'' ? ''image/gif'' : ext == ''webp'' ? ''image/webp'' : ext == ''pdf'' ? ''application/pdf'' : ''image/png'';
      }
      if (mime == ''application/pdf'') {
        uc = [{ type: ''input_file'', file_id: String(uploadFileId) }, { type: ''input_text'', text: String(prompt) }];
      } else {
        uc = [{ type: ''input_image'', file_id: String(uploadFileId) }, { type: ''input_text'', text: String(prompt) }];
      }
    }
    inp.push({ role: ''user'', content: uc });
    var b = { model: String(model || ''gpt-4o-mini''), input: inp };
    var t = Number(temperature);
    if (String(temperature || '''') != '''' && !isNaN(t)) { b.temperature = t; }
    var mt = Number(max_tokens);
    if (String(max_tokens || '''') != '''' && !isNaN(mt)) { b.max_output_tokens = mt; }
    JSON.stringify(b)'
  nodeName: Body
  output: false
