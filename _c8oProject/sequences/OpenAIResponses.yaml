  expression: '''Bearer '' + (String(api_key || '''').trim() != '''' ? String(api_key).trim() : String(''${lib_AIConnector.openai_apikey.secret=}'').trim())'
  nodeName: Auth
  output: false
↓Build_FilePath [steps.ElementStep-1791816987306]: 
  comment: Resolves the uploaded file path (relative paths in test cases are resolved against the Convertigo projects directory) as a hidden element used as the Call_UploadFile file variable source.
  expression: |
    'var fp = String(file || '''').trim();
    if (fp != '''') {
      var f = new java.io.File(fp);
      if (!f.exists()) {
        var pd = String(com.twinsoft.convertigo.engine.Engine.PROJECTS_PATH);
        var c1 = new java.io.File(pd + ''/lib_AIConnector/'' + fp);
        var c2 = new java.io.File(pd + ''/'' + fp);
        fp = c1.exists() ? String(c1.getAbsolutePath()) : (c2.exists() ? String(c2.getAbsolutePath()) : fp);
      }
    }
    fp'
  nodeName: FilePath
  output: false
↓Build_Purpose [steps.ElementStep-1791817024317]: 
  comment: 'Computes the OpenAI Files API purpose from the file type: vision for images, user_data for PDFs. Hidden element used as the Call_UploadFile purpose source.'
  expression: |
    'var fp = String(file || '''').trim();
    var mime = String(file_type || '''').trim();
    if (mime == '''' && fp != '''') {
      var ext = fp.toLowerCase().replace(/.*\./, '''');
      mime = (ext == ''jpg'' || ext == ''jpeg'') ? ''image/jpeg'' : ext == ''gif'' ? ''image/gif'' : ext == ''webp'' ? ''image/webp'' : ext == ''pdf'' ? ''application/pdf'' : ''image/png'';
    }
    mime == ''application/pdf'' ? ''user_data'' : ''vision'''
  nodeName: Purpose
  output: false
